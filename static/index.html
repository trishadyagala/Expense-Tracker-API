<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expense Tracker</title>
<style>
  :root { --bg:#f4f6fb; --card:#fff; --text:#1f2937; --muted:#6b7280; --line:#e5e7eb;
          --green:#16a34a; --red:#dc2626; --blue:#2563eb; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background:var(--bg); color:var(--text); }
  header { background:var(--blue); color:#fff; padding:18px 24px; }
  header h1 { margin:0; font-size:1.4rem; }
  header p { margin:4px 0 0; opacity:.85; font-size:.9rem; }
  main { max-width:1000px; margin:20px auto; padding:0 16px; display:grid; gap:16px; }
  .cards { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .card { background:var(--card); border-radius:10px; padding:16px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .stat span { display:block; color:var(--muted); font-size:.8rem; text-transform:uppercase; letter-spacing:.04em; }
  .stat strong { font-size:1.6rem; }
  .income { color:var(--green); } .expense { color:var(--red); }
  h2 { margin:0 0 12px; font-size:1.05rem; }
  form, .filters { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; align-items:end; }
  label { font-size:.8rem; color:var(--muted); display:grid; gap:4px; }
  input, select { padding:9px; border:1px solid var(--line); border-radius:6px; font-size:.95rem; width:100%; }
  button { padding:10px 14px; border:0; border-radius:6px; background:var(--blue); color:#fff;
           font-size:.95rem; cursor:pointer; }
  button.secondary { background:#e5e7eb; color:var(--text); }
  button.small { padding:5px 10px; font-size:.8rem; }
  button.danger { background:var(--red); }
  table { width:100%; border-collapse:collapse; font-size:.92rem; }
  th, td { text-align:left; padding:9px 8px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:600; font-size:.8rem; text-transform:uppercase; }
  td.actions { white-space:nowrap; text-align:right; }
  .table-wrap { overflow-x:auto; }
  #msg { min-height:1.2em; font-size:.9rem; margin-top:8px; }
  #msg.err { color:var(--red); } #msg.ok { color:var(--green); }
  .empty { color:var(--muted); text-align:center; padding:20px; }
  @media (max-width:600px){ .cards{grid-template-columns:1fr;} }
</style>
</head>
<body>
<header>
  <h1>Expense Tracker</h1>
  <p>Frontend for the REST API &middot; <a href="/api" style="color:#fff">view API endpoints</a></p>
</header>
<main>
  <section class="cards">
    <div class="card stat"><span>Total income</span><strong class="income" id="inc">0.00</strong></div>
    <div class="card stat"><span>Total expenses</span><strong class="expense" id="exp">0.00</strong></div>
    <div class="card stat"><span>Balance</span><strong id="bal">0.00</strong></div>
  </section>

  <section class="card">
    <h2 id="formTitle">Add transaction</h2>
    <form id="txnForm">
      <label>Type
        <select id="type"><option value="expense">Expense</option><option value="income">Income</option></select>
      </label>
      <label>Amount <input id="amount" type="number" step="0.01" min="0.01" required></label>
      <label>Category <input id="category" list="catList" maxlength="50" required placeholder="e.g. food"></label>
      <label>Description <input id="description" maxlength="255" placeholder="optional"></label>
      <label>Date <input id="date" type="date"></label>
      <div style="display:flex;gap:8px">
        <button type="submit" id="saveBtn">Add</button>
        <button type="button" class="secondary" id="cancelBtn" hidden>Cancel</button>
      </div>
    </form>
    <datalist id="catList"></datalist>
    <div id="msg"></div>
  </section>

  <section class="card">
    <h2>Filters</h2>
    <div class="filters">
      <label>Type
        <select id="fType"><option value="">All</option><option value="income">Income</option><option value="expense">Expense</option></select>
      </label>
      <label>Category <input id="fCategory" placeholder="e.g. food"></label>
      <label>From <input id="fStart" type="date"></label>
      <label>To <input id="fEnd" type="date"></label>
      <div style="display:flex;gap:8px">
        <button id="applyBtn">Apply</button>
        <button class="secondary" id="clearBtn">Clear</button>
      </div>
    </div>
  </section>

  <section class="card">
    <h2>Transactions <span id="count" style="color:var(--muted);font-weight:400"></span></h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Date</th><th>Type</th><th>Category</th><th>Description</th><th>Amount</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
let editingId = null;

function money(n) { return Number(n).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2}); }
function message(text, kind) { const m = $("msg"); m.textContent = text; m.className = kind || ""; }

async function api(path, options) {
  const res = await fetch(path, options);
  const data = await res.json();
  if (!res.ok) {
    const details = data.details ? " " + Object.values(data.details).join(" ") : "";
    throw new Error((data.error || "Request failed.") + details);
  }
  return data;
}

function filterQuery() {
  const p = new URLSearchParams();
  if ($("fType").value) p.set("type", $("fType").value);
  if ($("fCategory").value.trim()) p.set("category", $("fCategory").value.trim());
  if ($("fStart").value) p.set("start_date", $("fStart").value);
  if ($("fEnd").value) p.set("end_date", $("fEnd").value);
  const q = p.toString();
  return q ? "?" + q : "";
}

async function load() {
  try {
    const q = filterQuery();
    const [list, sum, cats] = await Promise.all([
      api("/api/transactions" + q), api("/api/summary" + q), api("/api/categories")
    ]);
    $("inc").textContent = money(sum.total_income);
    $("exp").textContent = money(sum.total_expenses);
    const bal = $("bal");
    bal.textContent = money(sum.balance);
    bal.className = sum.balance >= 0 ? "income" : "expense";
    $("count").textContent = "(" + list.count + ")";
    $("catList").replaceChildren(...cats.categories.map(c => { const o = document.createElement("option"); o.value = c; return o; }));
    renderRows(list.transactions);
  } catch (e) { message(e.message, "err"); }
}

function cell(text, cls) { const td = document.createElement("td"); td.textContent = text; if (cls) td.className = cls; return td; }

function renderRows(items) {
  const body = $("rows");
  body.replaceChildren();
  if (!items.length) {
    const tr = document.createElement("tr"), td = cell("No transactions yet.", "empty");
    td.colSpan = 6; tr.appendChild(td); body.appendChild(tr); return;
  }
  for (const t of items) {
    const tr = document.createElement("tr");
    tr.append(cell(t.date), cell(t.type, t.type), cell(t.category), cell(t.description),
              cell((t.type === "income" ? "+" : "-") + money(t.amount), t.type));
    const act = document.createElement("td"); act.className = "actions";
    const edit = document.createElement("button"); edit.className = "small secondary"; edit.textContent = "Edit";
    edit.onclick = () => startEdit(t);
    const del = document.createElement("button"); del.className = "small danger"; del.textContent = "Delete";
    del.style.marginLeft = "6px"; del.onclick = () => remove(t.id);
    act.append(edit, del); tr.appendChild(act); body.appendChild(tr);
  }
}

function startEdit(t) {
  editingId = t.id;
  $("type").value = t.type; $("amount").value = t.amount; $("category").value = t.category;
  $("description").value = t.description; $("date").value = t.date;
  $("formTitle").textContent = "Edit transaction #" + t.id;
  $("saveBtn").textContent = "Save changes"; $("cancelBtn").hidden = false;
  window.scrollTo({top: 0, behavior: "smooth"});
}

function resetForm() {
  editingId = null; $("txnForm").reset(); $("date").value = new Date().toISOString().slice(0, 10);
  $("formTitle").textContent = "Add transaction"; $("saveBtn").textContent = "Add"; $("cancelBtn").hidden = true;
}

async function remove(id) {
  if (!confirm("Delete transaction #" + id + "?")) return;
  try { await api("/api/transactions/" + id, {method: "DELETE"}); message("Deleted.", "ok"); load(); }
  catch (e) { message(e.message, "err"); }
}

$("txnForm").addEventListener("submit", async ev => {
  ev.preventDefault();
  const body = {
    type: $("type").value, amount: $("amount").value, category: $("category").value,
    description: $("description").value, date: $("date").value || undefined
  };
  try {
    const url = editingId ? "/api/transactions/" + editingId : "/api/transactions";
    await api(url, {method: editingId ? "PUT" : "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
    message(editingId ? "Updated." : "Added.", "ok");
    resetForm(); load();
  } catch (e) { message(e.message, "err"); }
});

$("cancelBtn").onclick = () => { resetForm(); message(""); };
$("applyBtn").onclick = load;
$("clearBtn").onclick = () => { ["fType", "fCategory", "fStart", "fEnd"].forEach(id => $(id).value = ""); load(); };

resetForm();
load();
</script>
</body>
</html>
